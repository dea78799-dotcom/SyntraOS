name: SyntraOS CI

on:
  push:
    branches:
      - main
      # Run the full validation suite on active stacked process-identity branches.
      - design/process-identity-lifecycle-v1
      - design/process-thread-ownership-v1
      - feat/process-thread-ownership-v1
      - feat/process-termination-cascade-v1
      - design/thread-exit-reclamation-v1
      - feat/arm64-thread-exit-v1
      - design/thread-resource-ownership-v1
      - design/deferred-thread-reaper-v1
      - design/thread-identity-v1
      - feat/thread-identity-v1
      - feat/thread-handle-owned-api-v1
      - design/thread-switch-away-proof-v1
      - feat/thread-switch-away-proof-v1
      - design/d3-resource-reclamation-audit-v1
      - design/d3-resource-descriptor-api-v1
      - design/d3-deferred-reaper-runtime-v1
      - feat/memory-allocation-identity-v2
      - design/d3-scheduler-resource-integration-v1
      - feat/d3-thread-resource-descriptor-v1
      - feat/d3-scheduler-reservation-transaction-v1
      - feat/d3-owned-kernel-thread-coordinator-v1
      - feat/d35-reaper-event-handoff-v1
      - feat/d352-dedicated-reaper-context-v1
      - feat/d353-safe-thread-resource-reclamation-v1
      - feat/d354-slot-lifecycle-metadata-v1
      - feat/d355-active-slot-scan-guards-v1
      - feat/d356-generation-safe-tcb-retirement-v1
      - feat/d357-safe-thread-slot-reuse-v1
      - test/d358-reused-slot-abort-coverage-v1
      - test/d359-owned-thread-rollback-fault-injection-v1
      - test/d3510-generation-exhaustion-boundary-v1
      - feat/d3511-reaper-retired-candidate-reuse-v1
      - test/d3512-reaper-candidate-ack-rollback-v1
      - test/d3513-reaper-full-table-fifo-preservation-v1
      - test/d3514-nonterminal-event-capacity-v1
      - test/d3515-duplicate-terminal-event-idempotence-v1
      - test/d3516-conflicting-terminal-proof-quarantine-v1

  pull_request:
    branches:
      - main
      - feat/d35-reaper-event-handoff-v1
      - feat/d352-dedicated-reaper-context-v1
      - design/d354-generation-safe-tcb-retirement-v1
      - feat/d354-slot-lifecycle-metadata-v1
      - feat/d355-active-slot-scan-guards-v1
      - feat/d356-generation-safe-tcb-retirement-v1
      - feat/d357-safe-thread-slot-reuse-v1
      - test/d358-reused-slot-abort-coverage-v1
      - test/d359-owned-thread-rollback-fault-injection-v1
      - test/d3510-generation-exhaustion-boundary-v1
      - feat/d3511-reaper-retired-candidate-reuse-v1
      - test/d3512-reaper-candidate-ack-rollback-v1
      - test/d3513-reaper-full-table-fifo-preservation-v1
      - test/d3514-nonterminal-event-capacity-v1
      - test/d3515-duplicate-terminal-event-idempotence-v1
      - test/d3516-conflicting-terminal-proof-quarantine-v1

  # Run a health check every day at 02:00 UTC (09:00 Vietnam time).
  schedule:
    - cron: "0 2 * * *"

  # Allow a maintainer to start the same checks manually.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntraos-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test SyntraOS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check build tools
        id: tools
        shell: bash
        run: |
          set +e

          MISSING=0

          for tool in cmake ninja gcc; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool is available:"
              "$tool" --version | head -n 1
            else
              echo "$tool is missing"
              MISSING=1
            fi
          done

          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        if: steps.tools.outputs.missing == '1'
        shell: bash
        run: |
          set -e

          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y cmake ninja-build gcc

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
          gcc --version

      - name: Configure Debug
        run: cmake --preset host-debug

      - name: Build Debug
        run: cmake --build --preset host-debug

      - name: Run Unit Tests
        run: ctest --test-dir build/host-debug --output-on-failure

      - name: Configure Release
        run: cmake --preset host-release

      - name: Build Release
        run: cmake --build --preset host-release

      - name: Run Release Tests
        run: ctest --test-dir build/host-release --output-on-failure

  arm64-cross-build:
    name: Build ARM64 Kernel ELF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare APT archive cache
        shell: bash
        env:
          APT_ARCHIVE_CACHE: ${{ runner.temp }}/syntraos-apt/archives
        run: |
          set -euo pipefail
          mkdir -p "$APT_ARCHIVE_CACHE/partial"
          chmod 1777 "$APT_ARCHIVE_CACHE" "$APT_ARCHIVE_CACHE/partial"

      - name: Restore APT package archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/syntraos-apt/archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-syntraos-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-syntraos-apt-

      - name: Install ARM64 cross-compilation tools
        id: arm64_tools
        timeout-minutes: 25
        shell: bash
        env:
          APT_ARCHIVE_CACHE: ${{ runner.temp }}/syntraos-apt/archives
        run: |
          set -euo pipefail

          MISSING_PACKAGES=()

          check_tool() {
            local command_name="$1"
            local package_name="$2"

            if ! command -v "$command_name" >/dev/null 2>&1; then
              MISSING_PACKAGES+=("$package_name")
            fi
          }

          check_tool cmake cmake
          check_tool ninja ninja-build
          check_tool aarch64-linux-gnu-gcc gcc-aarch64-linux-gnu
          check_tool aarch64-linux-gnu-ld binutils-aarch64-linux-gnu

          # The freestanding ARM64 build still includes <limits.h>; without
          # cross libc development headers GCC falls back to host headers.
          if ! dpkg-query -W -f='${Status}' libc6-dev-arm64-cross 2>/dev/null | grep -q "install ok installed"; then
            MISSING_PACKAGES+=(libc6-dev-arm64-cross)
          fi

          if [ "${#MISSING_PACKAGES[@]}" -eq 0 ]; then
            echo "All ARM64 build tools are already available; skipping apt."
            echo "apt_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Installing missing packages: ${MISSING_PACKAGES[*]}"

          sudo install -d -m 1777 "$APT_ARCHIVE_CACHE" "$APT_ARCHIVE_CACHE/partial"

          sudo apt-get \
            -o Dir::Cache::archives="$APT_ARCHIVE_CACHE" \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          echo "apt_updated=true" >> "$GITHUB_OUTPUT"

          sudo apt-get \
            -o Dir::Cache::archives="$APT_ARCHIVE_CACHE" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install --no-install-recommends -y "${MISSING_PACKAGES[@]}"

      - name: Verify ARM64 compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-ld --version

      - name: Configure ARM64
        run: |
          cmake -S cmake/arm64 -B build/arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/aarch64-linux-gnu.cmake"

      - name: Build ARM64 ELF
        run: cmake --build build/arm64 --verbose

      - name: Validate ARM64 diagnostic script syntax
        run: |
          bash -n tools/arm64/qemu_boot_test.sh
          bash -n tools/arm64/run_el0_no_gdb_test.sh

      - name: Verify ARM64 ELF
        run: |
          test -f build/arm64/syntraos_arm64.elf
          aarch64-linux-gnu-readelf -h build/arm64/syntraos_arm64.elf
          aarch64-linux-gnu-readelf -h build/arm64/syntraos_arm64.elf \
            | grep -q "AArch64"

      - name: Install QEMU only after ELF verification
        timeout-minutes: 12
        shell: bash
        env:
          APT_ARCHIVE_CACHE: ${{ runner.temp }}/syntraos-apt/archives
        run: |
          set -euo pipefail

          MISSING_PACKAGES=()
          if ! command -v qemu-system-aarch64 >/dev/null 2>&1; then
            MISSING_PACKAGES+=(qemu-system-arm)
          fi
          # SyntraOS boots the ELF directly with QEMU -kernel; it does not
          # use UEFI firmware, so the separate UEFI firmware package is omitted.

          if [ "${#MISSING_PACKAGES[@]}" -gt 0 ]; then
            sudo install -d -m 1777 "$APT_ARCHIVE_CACHE" "$APT_ARCHIVE_CACHE/partial"

            if [ "${{ steps.arm64_tools.outputs.apt_updated }}" != "true" ]; then
              sudo apt-get \
                -o Dir::Cache::archives="$APT_ARCHIVE_CACHE" \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 \
                update
            fi

            sudo apt-get \
              -o Dir::Cache::archives="$APT_ARCHIVE_CACHE" \
              -o APT::Keep-Downloaded-Packages=true \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              install --no-install-recommends -y "${MISSING_PACKAGES[@]}"
          else
            echo "QEMU ARM64 system emulator is already available; skipping apt."
          fi

      - name: Verify EL0 execution without GDB
        run: bash tools/arm64/run_el0_no_gdb_test.sh build/arm64/syntraos_arm64.elf

      - name: Upload EL0 no-GDB diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntraos-el0-no-gdb-logs-${{ github.sha }}
          path: build/arm64/el0-no-gdb-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Boot ARM64 ELF in QEMU
        run: bash tools/arm64/run_qemu.sh build/arm64/syntraos_arm64.elf

      - name: Verify QEMU RAM framebuffer desktop pixels
        run: bash tools/arm64/run_qemu_gui_test.sh build/arm64/syntraos_arm64.elf

      - name: Convert desktop screenshot to PNG for mobile viewing
        run: python3 tools/arm64/ppm_to_png.py build/arm64/syntraos-desktop.ppm build/arm64/syntraos-desktop.png

      - name: Upload SyntraOS desktop screenshots
        uses: actions/upload-artifact@v4
        with:
          name: syntraos-desktop-preview-${{ github.sha }}
          path: |
            build/arm64/syntraos-desktop.ppm
            build/arm64/syntraos-desktop.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 QEMU test image
        uses: actions/upload-artifact@v4
        with:
          name: syntraos-arm64-qemu-${{ github.sha }}
          path: build/arm64/syntraos_arm64.elf
          if-no-files-found: error
          retention-days: 14
