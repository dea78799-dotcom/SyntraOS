name: Compile GitHub Agentic Workflows

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-aw-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile and publish generated workflow artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub Agentic Workflows extension
        run: gh extension install github/gh-aw

      - name: Compile Markdown workflows
        run: gh aw compile

      - name: Upload generated lock files
        uses: actions/upload-artifact@v4
        with:
          name: syntraos-agentic-workflow-locks
          path: .github/workflows/*.lock.yml
          if-no-files-found: error
          retention-days: 7
